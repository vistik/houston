name: Bug report
description: Something in Houston doesn't work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If a number looks wrong, use the "Metric looks wrong" form instead. Please report security problems privately; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Watch a repository
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Houston version or commit
      description: The release, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PHP version, database, operating system and browser, if they matter.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `storage/logs/laravel.log` or the browser console. Remove any tokens first.
      render: shell
