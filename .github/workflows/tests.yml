name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      # The same checks as `composer ci:check`, with the tests run once under
      # PCOV so CI fails when line coverage drops below 95%.
      - name: Check Frontend
        run: |
          npm run check
          npm run test
          npm run types:check

      - name: Check PHP Style
        run: composer lint:check

      - name: Check PHP Types
        run: composer types:check

      - name: Run Tests With Coverage
        run: composer test:coverage
